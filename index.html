<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalcoITN</title>
<style>
  :root{
    --bg-top:#1c1c1e;
    --bg-mid:#0d0d10;
    --purple:#8b5cf6;
    --pink:#ec4899;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.09);
    --text-dim:rgba(255,255,255,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Segoe UI,Roboto,sans-serif;
    background:
      radial-gradient(circle at 15% 75%, rgba(255,150,60,0.10), transparent 45%),
      radial-gradient(circle at 90% 70%, rgba(236,72,153,0.14), transparent 50%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 60%);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    overflow-x:hidden;
    position:relative;
  }

  /* status-bar-ish top strip, echoing the screenshot's iOS chrome */
  .top-strip{
    position:fixed;
    top:0;left:0;right:0;
    height:64px;
    background:rgba(20,20,22,0.55);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,0.05);
  }

  .card{
    width:min(92vw, 380px);
    padding:56px 32px 44px;
    text-align:center;
    animation:rise 0.6s cubic-bezier(.2,.9,.25,1) both;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .icon{
    width:84px;height:84px;
    margin:0 auto 26px;
    border-radius:22px;
    background:linear-gradient(145deg, var(--purple), var(--pink));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px -6px rgba(236,72,153,0.45);
  }
  .icon svg{width:38px;height:38px;}

  h1{
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 10px;
  }

  .subtitle{
    font-family:"SF Mono", "Menlo", monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.12em;
    color:var(--text-dim);
    margin:0 0 40px;
  }

  .panel{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:26px;
    padding:30px 22px 26px;
    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);
  }

  .panel p.lead{
    font-size:15px;
    color:rgba(255,255,255,0.75);
    line-height:1.5;
    margin:0 0 26px;
  }

  .accede-btn{
    width:100%;
    padding:17px 0;
    border:none;
    border-radius:16px;
    font-size:17px;
    font-weight:700;
    color:#fff;
    letter-spacing:-0.01em;
    background:linear-gradient(120deg, var(--purple), var(--pink));
    cursor:pointer;
    box-shadow:0 8px 24px -8px rgba(139,92,246,0.55);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .accede-btn:active{
    transform:scale(0.97);
    box-shadow:0 4px 14px -6px rgba(139,92,246,0.5);
  }

  .status-line{
    margin-top:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:12px;
    color:rgba(255,255,255,0.4);
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#34d399;
    box-shadow:0 0 6px #34d399;
    flex-shrink:0;
  }

  .footer-note{
    margin-top:18px;
    font-size:12px;
    line-height:1.6;
    color:rgba(255,255,255,0.28);
    max-width:320px;
    margin-left:auto;
    margin-right:auto;
  }

  /* fondu noir de sortie */
  .fade-overlay{
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
    z-index:999;
  }
  .fade-overlay.active{
    opacity:1;
    pointer-events:all;
  }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    .fade-overlay{transition:none;}
  }
</style>
</head>
<body>

<div class="top-strip"></div>

<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path>
    </svg>
  </div>

  <h1>Talco IT Networks</h1>
  <p class="subtitle">ADMINISTRATION TALCOIT-NETWORKS</p>

  <div class="panel">
    <p class="lead">Le portail est prêt. Continuez pour accéder à votre espace TalcoITN.</p>
    <button class="accede-btn" id="accedeBtn">Accéder</button>
  </div>

  <div class="status-line">
    <span class="dot"></span>
    <span>Connexion sécurisée établie</span>
  </div>

  <p class="footer-note">
    TalcoITN (Talco IT Networks, ITN) est le portail sécurisé regroupant Exchange, Cloud, Intelligence, Music, Scientis, Enseignement et Pratics.
  </p>
</div>

<div class="fade-overlay" id="fadeOverlay"></div>

<script>
  const btn = document.getElementById('accedeBtn');
  const overlay = document.getElementById('fadeOverlay');
  const destination = 'https://natlacaxi.github.io/itn/';

  btn.addEventListener('click', () => {
    overlay.classList.add('active');
    setTimeout(() => {
      window.location.href = destination;
    }, 500);
  });
</script>

</body>
</html>
